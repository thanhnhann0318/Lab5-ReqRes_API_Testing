name: ReqRes API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run ReqRes_Collection.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=${{ secrets.REQRES_API_KEY }}" \
            --reporters cli
